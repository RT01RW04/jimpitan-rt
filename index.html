<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- ===== PWA / iPhone: pasang lewat Safari > Bagikan > Tambah ke Layar Utama ===== -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jimpitan">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="ikon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="ikon/ikon-192.png">
<meta name="theme-color" content="#0B1220">
<title>Jimpitan Ronda RT 01 RW 04</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ======================= HEADER ======================= -->
<header id="appbar">
  <div class="ab-left">
    <div class="ab-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
        <path d="M7 8v8M10.5 8v8M14 8v8M17 8v8"/>
      </svg>
    </div>
    <div class="ab-txt">
      <h1 id="abTitle">Jimpitan Ronda</h1>
      <p id="abSub">RT 01 / RW 04 · Margorejo</p>
    </div>
  </div>
  <button class="ab-btn" id="btnHeaderAction" title="Bagikan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
      <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
    </svg>
  </button>
</header>

<!-- ======================= MAIN ======================= -->
<main id="main">
  <section id="view-ronda" class="view"></section>
  <section id="view-rumah" class="view hidden"></section>
  <section id="view-rekap" class="view hidden"></section>
  <section id="view-kas" class="view hidden"></section>
  <section id="view-atur" class="view hidden"></section>
</main>

<!-- ======================= BOTTOM NAV ======================= -->
<nav id="tabbar">
  <button class="tab active" data-tab="ronda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/></svg>
    <span>Ronda</span>
  </button>
  <button class="tab" data-tab="rumah">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
    <span>Rumah</span>
  </button>
  <button class="tab" data-tab="rekap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Rekap</span>
  </button>
  <button class="tab" data-tab="kas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
    <span>Kas</span>
  </button>
  <button class="tab" data-tab="atur">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Atur</span>
  </button>
</nav>

<!-- ======================= SCANNER ======================= -->
<div id="scanOverlay" class="hidden">
  <div id="reader"></div>
  <div class="scan-ui">
    <div class="scan-top">
      <button class="icon-btn" id="scanClose" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="scan-title">
        <strong id="scanTitle">Scan Barcode</strong>
        <small id="scanSub">Arahkan ke stiker barcode rumah</small>
      </div>
      <button class="icon-btn" id="scanTorch" aria-label="Senter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6l-1 6 3 2-7 12 1.5-9H8l1-11z"/></svg>
      </button>
    </div>

    <div class="scan-frame"><span></span><span></span><span></span><span></span><div class="scan-line"></div></div>

    <div class="scan-bottom">
      <div id="scanToast" class="scan-toast hidden"></div>
      <div id="scanCounter" class="scan-counter"></div>
      <button class="btn btn-ghost btn-block" id="scanManual">Kode tidak terbaca? Ketik manual</button>
    </div>
  </div>
</div>

<!-- ======================= MODAL / SHEET ======================= -->
<div id="sheetWrap" class="hidden">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><h3 id="sheetTitle">Judul</h3>
      <button class="icon-btn sm" id="sheetClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast"></div>

<script src="lib/html5-qrcode.min.js"></script>
<script src="lib/qrcode-gen.min.js"></script>
<script src="app.js"></script>
</body>
</html>
